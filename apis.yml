aid: pipe-network
name: Pipe Network
description: >-
  Pipe Network is a decentralized storage and content-delivery network built on
  Solana, marketed as "Firestarter" storage. It offers content-addressed
  (Blake3) object storage with client-side AES-256-GCM and post-quantum
  (Kyber-1024 / Dilithium5) encryption, deterministic public URLs of the form
  /{account}/{hash}, prepaid-USDC billing funded via Solana Pay, and first-party
  TypeScript / Python / Rust SDKs plus a Rust CLI. The SDKs ship native agent-
  framework tool adapters (OpenAI, Anthropic, LangChain, LlamaIndex, Vercel AI
  SDK, Cloudflare AI Workflows, AutoGen, CrewAI) and x402 machine-to-machine
  payment support. Backed by Multicoin Capital.
